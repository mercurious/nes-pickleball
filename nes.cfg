# NES Pickleball linker config: NROM-256, 32 KB PRG at $8000, 8 KB CHR, 2 KB RAM.
MEMORY {
    ZP:      file = "", start = $0000, size = $0100, type = rw, define = yes;
    OAMRAM:  file = "", start = $0200, size = $0100, type = rw;
    VBUFRAM: file = "", start = $0300, size = $0100, type = rw;
    RAM:     file = "", start = $0400, size = $0300, type = rw, define = yes;
    STACK:   file = "", start = $0700, size = $00F0, type = rw, define = yes;
    MBOX:    file = "", start = $07F0, size = $0010, type = rw;
    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;
    PRG:     file = %O, start = $8000, size = $7FFA, fill = yes, fillval = $FF;
    VEC:     file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:     file = %O, start = $0000, size = $2000, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    OAM:      load = OAMRAM,  type = bss;
    VBUF:     load = VBUFRAM, type = bss;
    BSS:      load = RAM,     type = bss, define = yes;
    MAILBOX:  load = MBOX,    type = bss, optional = yes;
    HEADER:   load = HEADER,  type = ro;
    STARTUP:  load = PRG,     type = ro;
    CODE:     load = PRG,     type = ro;
    RODATA:   load = PRG,     type = ro;
    DATA:     load = PRG,     type = rw, run = RAM, define = yes;
    DMC:      load = PRG,     type = ro, start = $D800, optional = yes;
    VECTORS:  load = VEC,     type = ro;
    CHARS:    load = CHR,     type = ro;
}
