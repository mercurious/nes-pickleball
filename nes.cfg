# NES Pickleball linker config: MMC3 (mapper 4, a TSROM-style board), 256 KB PRG in 8 KB banks, 32 KB CHR,
# 8 KB PRG-RAM. PRG mode 1: $8000 is fixed to bank 30, $A000 is R7 (set once to bank 29), $C000 is R6 (the DMC's
# sample bank, switched per sample), $E000 is fixed to bank 31. Bank 28 is the image of the code that runs from
# PRG-RAM at $6000 (crt0 copies it at reset). Banks 0-27 hold samples; the DMC reads only $C000-$FFFF.
MEMORY {
    ZP:      file = "", start = $0000, size = $0100, type = rw, define = yes;
    OAMRAM:  file = "", start = $0200, size = $0100, type = rw;
    VBUFRAM: file = "", start = $0300, size = $0100, type = rw;
    RAM:     file = "", start = $0400, size = $0300, type = rw, define = yes;
    STACK:   file = "", start = $0700, size = $00F0, type = rw, define = yes;
    MBOX:    file = "", start = $07F0, size = $0010, type = rw;
    WRAM:    file = "", start = $6000, size = $2000, type = rw, define = yes;
    HEADER:  file = %O, start = $0000, size = $0010, fill = yes;
    DMC00:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC01:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC02:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC03:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC04:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC05:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC06:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC07:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC08:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC09:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC10:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC11:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC12:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC13:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC14:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC15:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC16:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC17:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC18:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC19:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC20:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC21:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC22:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC23:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC24:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC25:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC26:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    DMC27:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    BANK28:  file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF;
    BANK29:  file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF;
    BANK30:  file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF;
    BANK31:  file = %O, start = $E000, size = $1FFA, fill = yes, fillval = $FF;
    VEC:     file = %O, start = $FFFA, size = $0006, fill = yes;
    CHR:     file = %O, start = $0000, size = $8000, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    OAM:      load = OAMRAM,  type = bss;
    VBUF:     load = VBUFRAM, type = bss;
    BSS:      load = RAM,     type = bss, define = yes;
    MAILBOX:  load = MBOX,    type = bss, optional = yes;
    HEADER:   load = HEADER,  type = ro;
    CODE_W:   load = BANK28,  run = WRAM, type = rw, define = yes;
    CODE_A:   load = BANK29,  type = ro;
    RODATA_A: load = BANK29,  type = ro, optional = yes;
    CODE:     load = BANK30,  type = ro;
    STARTUP:  load = BANK31,  type = ro;
    KERNEL:   load = BANK31,  type = ro;
    RODATA:   load = BANK31,  type = ro;
    PENTLY:   load = BANK31,  type = ro;
    DATA:     load = BANK31,  type = rw, run = RAM, define = yes;
    DMC00:    load = DMC00,   type = ro, align = $40, optional = yes;
    DMC01:    load = DMC01,   type = ro, align = $40, optional = yes;
    DMC02:    load = DMC02,   type = ro, align = $40, optional = yes;
    DMC03:    load = DMC03,   type = ro, align = $40, optional = yes;
    DMC04:    load = DMC04,   type = ro, align = $40, optional = yes;
    DMC05:    load = DMC05,   type = ro, align = $40, optional = yes;
    DMC06:    load = DMC06,   type = ro, align = $40, optional = yes;
    DMC07:    load = DMC07,   type = ro, align = $40, optional = yes;
    DMC08:    load = DMC08,   type = ro, align = $40, optional = yes;
    DMC09:    load = DMC09,   type = ro, align = $40, optional = yes;
    DMC10:    load = DMC10,   type = ro, align = $40, optional = yes;
    DMC11:    load = DMC11,   type = ro, align = $40, optional = yes;
    DMC12:    load = DMC12,   type = ro, align = $40, optional = yes;
    DMC13:    load = DMC13,   type = ro, align = $40, optional = yes;
    DMC14:    load = DMC14,   type = ro, align = $40, optional = yes;
    DMC15:    load = DMC15,   type = ro, align = $40, optional = yes;
    DMC16:    load = DMC16,   type = ro, align = $40, optional = yes;
    DMC17:    load = DMC17,   type = ro, align = $40, optional = yes;
    DMC18:    load = DMC18,   type = ro, align = $40, optional = yes;
    DMC19:    load = DMC19,   type = ro, align = $40, optional = yes;
    DMC20:    load = DMC20,   type = ro, align = $40, optional = yes;
    DMC21:    load = DMC21,   type = ro, align = $40, optional = yes;
    DMC22:    load = DMC22,   type = ro, align = $40, optional = yes;
    DMC23:    load = DMC23,   type = ro, align = $40, optional = yes;
    DMC24:    load = DMC24,   type = ro, align = $40, optional = yes;
    DMC25:    load = DMC25,   type = ro, align = $40, optional = yes;
    DMC26:    load = DMC26,   type = ro, align = $40, optional = yes;
    DMC27:    load = DMC27,   type = ro, align = $40, optional = yes;
    VECTORS:  load = VEC,     type = ro;
    CHARS:    load = CHR,     type = ro;
}
